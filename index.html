<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Bookshelf</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262628" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Bookshelf">
  <link rel="stylesheet" href="/styles/app.css">
  <script src="/vendor/jszip.min.js" defer></script>
  <script type="module" src="/js/ui-controller.js"></script>
</head>
<body data-ui="light">
  <svg width="0" height="0" class="sr-only" aria-hidden="true">
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4" height="16" rx="1"/><rect x="9.5" y="4" width="4" height="16" rx="1"/><path d="m16 5.2 3.6-.9 3 15.2-3.7.8z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
    <symbol id="i-rows" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-goals" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
    <symbol id="i-books" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.3 2.8 2.8L16.2 9.6"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h14M5 18h9"/></symbol>
    <symbol id="i-follow" viewBox="0 0 24 24"><path d="M3.5 5.5c2.5-1 5.5-1 8.5.8v13c-3-1.8-6-1.8-8.5-.8z"/><path d="M15 9h5.5M18 6.5 20.5 9 18 11.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect class="fill" x="6.5" y="5" width="4" height="14" rx="1.2"/><rect class="fill" x="13.5" y="5" width="4" height="14" rx="1.2"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="fill" d="M19 6.3v11.4a.9.9 0 0 1-1.4.75L10 13.2V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v3.8l7.6-5.25a.9.9 0 0 1 1.4.75z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="fill" d="M5 6.3v11.4a.9.9 0 0 0 1.4.75L14 13.2V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v3.8L6.4 5.55A.9.9 0 0 0 5 6.3z"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 17v2.5h14V17"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></symbol>
  </svg>

  <!-- ============================== LIBRARY ============================== -->
  <section id="library" class="view library-view" aria-label="Library">
    <aside class="sidebar">
      <div class="side-brand" id="brand-home" role="button" tabindex="0" title="Library home"><svg class="icon"><use href="#i-books"/></svg>Bookshelf</div>
      <div class="side-label">Library</div>
      <nav id="collections-nav" class="side-nav" aria-label="Collections"></nav>
      <div class="side-label">You</div>
      <nav class="side-nav">
        <button class="side-item" id="btn-stats"><svg class="icon"><use href="#i-goals"/></svg><span>Reading Goals</span></button>
        <button class="side-item" id="btn-install" hidden><svg class="icon"><use href="#i-install"/></svg><span>Install App</span></button>
      </nav>
      <div class="side-footer"><span class="status-dot" id="lib-lamp"></span><span id="lib-lamp-text">Checking narrator…</span></div>
    </aside>

    <main class="lib-main">
      <header class="lib-toolbar">
        <div class="lib-heading">
          <h1 id="collection-name">All Books</h1>
          <span id="lib-count" class="muted"></span>
        </div>
        <div class="lib-actions">
          <label class="search-field">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="lib-search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search library">
          </label>
          <div class="seg" role="group" aria-label="Layout">
            <button id="view-shelf" aria-pressed="true" title="Grid"><svg class="icon"><use href="#i-grid"/></svg></button>
            <button id="view-list" aria-pressed="false" title="List"><svg class="icon"><use href="#i-rows"/></svg></button>
          </div>
          <label class="btn-primary" id="btn-import" tabindex="0" role="button">
            <svg class="icon"><use href="#i-plus"/></svg><span>Add Books</span>
            <input type="file" id="file-input" accept=".epub,.pdf,.txt,application/epub+zip,application/pdf,text/plain" multiple hidden>
          </label>
        </div>
      </header>
      <div class="lib-scroll" id="bookcase">
        <section id="continue" class="continue" aria-label="Continue reading"></section>
        <div id="shelves-head" class="section-head"></div>
        <div id="shelves" class="grid"></div>
        <div id="list" class="list" hidden></div>
      </div>
    </main>
  </section>

  <!-- ============================== READER =============================== -->
  <section id="reader" class="view reader-view" data-theme="auto" aria-label="Reader" hidden>
    <header class="reader-toolbar">
      <div class="pill-group back-group">
        <button id="btn-back" class="back-btn" title="Back to Library (Esc)"><svg class="icon"><use href="#i-left"/></svg><span>Library</span></button>
      </div>
      <div class="pill-group">
        <button id="btn-toc" title="Contents"><svg class="icon"><use href="#i-list"/></svg></button>
        <button id="btn-notes" title="Highlights &amp; Notes"><svg class="icon"><use href="#i-note"/></svg></button>
      </div>
      <div class="reader-title"><span id="reader-title"></span><span id="reader-chapter"></span></div>
      <div class="pill-group">
        <button id="btn-aa" title="Appearance" class="aa"><span class="aa-small">A</span><span class="aa-big">A</span></button>
        <button id="btn-search" title="Search in book"><svg class="icon"><use href="#i-search"/></svg></button>
      </div>
      <div class="pill-group">
        <button id="btn-bookmark" title="Bookmark page (B)" aria-pressed="false"><svg class="icon"><use href="#i-bookmark"/></svg></button>
      </div>
    </header>

    <div class="desk">
      <div class="book">
        <div class="text-viewport"><div class="flow" id="flow"></div></div>
        <div class="folio folio-left"></div>
        <div class="folio folio-right"></div>
        <div class="page-ribbon" id="page-ribbon" hidden></div>
        <button class="turn-zone prev" aria-label="Previous page"><svg class="icon"><use href="#i-left"/></svg></button>
        <button class="turn-zone next" aria-label="Next page"><svg class="icon"><use href="#i-right"/></svg></button>
      </div>
      <button class="corner tl" data-dir="-1" aria-label="Previous page" title="Previous page"></button>
      <button class="corner bl" data-dir="-1" aria-label="Previous page" title="Previous page"></button>
      <button class="corner tr" data-dir="1" aria-label="Next page" title="Next page"></button>
      <button class="corner br" data-dir="1" aria-label="Next page" title="Next page"></button>
    </div>

    <button class="follow-chip" id="follow-chip" hidden>Return to narration</button>

    <div class="player" id="player" role="region" aria-label="Narration">
      <button class="voice-btn" id="btn-voice" title="Narrator voice">
        <span class="avatar" id="voice-avatar">E<span class="status-dot" id="kokoro-lamp"></span></span>
        <span class="voice-text"><span id="voice-name">Emma</span><span id="voice-sub">British · Female</span></span>
        <svg class="icon chev"><use href="#i-down"/></svg>
      </button>
      <div class="transport">
        <button id="btn-prev-sentence" title="Previous sentence (Shift ←)"><svg class="icon solid"><use href="#i-prev"/></svg></button>
        <button id="btn-play" class="play" title="Play (Space)"><svg class="icon solid"><use href="#i-play"/></svg></button>
        <button id="btn-next-sentence" title="Next sentence (Shift →)"><svg class="icon solid"><use href="#i-next"/></svg></button>
      </div>
      <button class="speed-btn" id="btn-speed" title="Playback speed">1×</button>
      <button class="icon-btn" id="btn-follow" title="Turn pages automatically while listening" aria-pressed="true"><svg class="icon"><use href="#i-follow"/></svg></button>
      <span class="time-left" id="time-chapter"></span>
    </div>

    <aside class="side-panel" id="side-panel" hidden aria-label="Contents"></aside>
  </section>

  <div id="popover-root"></div>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <div class="drop-overlay" id="drop-overlay" hidden><div class="drop-card"><svg class="icon"><use href="#i-plus"/></svg>Drop to add to your library<small>EPUB · PDF · TXT</small></div></div>
</body>
</html>
